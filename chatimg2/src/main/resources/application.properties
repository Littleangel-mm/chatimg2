spring.application.name=chatimg2

# PostgreSQL (tcpKeepAlive 防止生图等待期间连接被防火墙断开)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatimg2}?tcpKeepAlive=true&connectTimeout=10&socketTimeout=120&ApplicationName=chatimg2
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP — 远程数据库长连接保活
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.idle-timeout=60000

# 生成图片本地保存目录（启动时自动创建，相对于应用运行目录）
app.image.backup-path=./img/
app.image.download.max-bytes=${IMAGE_DOWNLOAD_MAX_BYTES:20971520}
app.image.download.max-attempts=${IMAGE_DOWNLOAD_MAX_ATTEMPTS:3}
app.image.download.retry-delay-ms=${IMAGE_DOWNLOAD_RETRY_DELAY_MS:1000}
app.image.download.connect-timeout-ms=${IMAGE_DOWNLOAD_CONNECT_TIMEOUT_MS:30000}
app.image.download.read-timeout-ms=${IMAGE_DOWNLOAD_READ_TIMEOUT_MS:120000}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=520MB

# API config
app.api.key=${API_KEY:${VITE_API_KEY:}}
app.api.url=${API_URL:${VITE_API_BASE_URL:https://www.maitokens.top/v1}}
app.api.model.text2img=${API_MODEL_TEXT2IMG:${VITE_IMAGE_MODEL:gpt-image-2}}
app.api.model.img2img=${API_MODEL_IMG2IMG:${VITE_IMAGE_MODEL:gpt-image-2}}

# QQ Mail verification. MAIL_PASSWORD is the SMTP authorization code.
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# 异步生图轮询（gpt-image-2 提交后返回 task_id，需轮询 /v1/tasks/{id}）
app.api.poll.initial-delay-ms=5000
app.api.poll.interval-ms=5000
app.api.poll.max-wait-ms=600000

# HTTP 超时（生图 API 可能耗时数分钟）
app.api.http.connect-timeout-ms=60000
app.api.http.submit-read-timeout-ms=600000
app.api.http.poll-read-timeout-ms=60000
app.api.submit.max-attempts=${API_SUBMIT_MAX_ATTEMPTS:3}
app.api.submit.retry-delay-ms=${API_SUBMIT_RETRY_DELAY_MS:3000}

# Generation recovery
app.generation.recovery.enabled=${GENERATION_RECOVERY_ENABLED:${APP_GENERATION_RECOVERY_ENABLED:true}}
app.generation.recovery.stale-after-ms=${GENERATION_RECOVERY_STALE_AFTER_MS:${APP_GENERATION_RECOVERY_STALE_AFTER_MS:7200000}}
app.generation.recovery.interval-ms=${GENERATION_RECOVERY_INTERVAL_MS:${APP_GENERATION_RECOVERY_INTERVAL_MS:120000}}
app.generation.lock.ttl-ms=${GENERATION_LOCK_TTL_MS:1800000}
app.generation.recovery.lock-ttl-ms=${GENERATION_RECOVERY_LOCK_TTL_MS:60000}
app.image.backup.lock-ttl-ms=${IMAGE_BACKUP_LOCK_TTL_MS:600000}
app.generation.executor.core-size=${GENERATION_EXECUTOR_CORE_SIZE:2}
app.generation.executor.max-size=${GENERATION_EXECUTOR_MAX_SIZE:8}
app.generation.executor.queue-capacity=${GENERATION_EXECUTOR_QUEUE_CAPACITY:100}
app.image.backup.executor.core-size=${IMAGE_BACKUP_EXECUTOR_CORE_SIZE:1}
app.image.backup.executor.max-size=${IMAGE_BACKUP_EXECUTOR_MAX_SIZE:2}
app.image.backup.executor.queue-capacity=${IMAGE_BACKUP_EXECUTOR_QUEUE_CAPACITY:50}

# 灵感画廊爬虫（爬取 img2.ai 的 prompt 库）
app.inspiration.source-url=${INSPIRATION_SOURCE_URL:https://img2.ai/api/photo-prompt-gallery}
app.inspiration.page-size=${INSPIRATION_PAGE_SIZE:30}
app.inspiration.max-pages=${INSPIRATION_MAX_PAGES:100}
# 是否把灵感画廊媒体下载到 img/upimg、img/upvideo（false 则前端直接使用远程 URL）
# 图片和视频目录分别维护一个 prompts.json 清单
app.inspiration.download-images=${INSPIRATION_DOWNLOAD_IMAGES:true}

# 定时自动爬取（默认每天凌晨 00:00，cron 为 6 段式 秒 分 时 日 月 周）
app.inspiration.schedule.enabled=${INSPIRATION_SCHEDULE_ENABLED:true}
app.inspiration.schedule.cron=${INSPIRATION_SCHEDULE_CRON:0 0 0 * * *}
app.inspiration.schedule.zone=${INSPIRATION_SCHEDULE_ZONE:Asia/Shanghai}

# Server
server.port=${APP_PORT:8080}

# ChatSeedance2 Flyway migrations share this PostgreSQL database but keep their own history.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=chatseedance2_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Seedance video provider
app.seedance.api.url=${SEEDANCE_API_URL:https://www.ai.bagege.cn/openai/v1}
app.seedance.api.key=${SEEDANCE_API_KEY:}
app.seedance.api.model=${SEEDANCE_API_MODEL:mm2-seedance2.0}
app.seedance.api.connect-timeout-ms=${SEEDANCE_CONNECT_TIMEOUT_MS:30000}
app.seedance.api.read-timeout-ms=${SEEDANCE_READ_TIMEOUT_MS:120000}
app.seedance.api.model-cache-ms=${SEEDANCE_MODEL_CACHE_MS:300000}

# Video task concurrency, recovery and media storage
app.video.debounce-window-ms=${VIDEO_DEBOUNCE_WINDOW_MS:3000}
app.video.poll-interval-ms=${VIDEO_POLL_INTERVAL_MS:5000}
app.video.poll-delayed-interval-ms=${VIDEO_POLL_DELAYED_INTERVAL_MS:30000}
app.video.poll-batch-size=${VIDEO_POLL_BATCH_SIZE:50}
app.video.task-lock-ttl-ms=${VIDEO_TASK_LOCK_TTL_MS:180000}
app.video.recovery-enabled=${VIDEO_RECOVERY_ENABLED:true}
app.video.executor.core-size=${VIDEO_EXECUTOR_CORE_SIZE:2}
app.video.executor.max-size=${VIDEO_EXECUTOR_MAX_SIZE:8}
app.video.executor.queue-capacity=${VIDEO_EXECUTOR_QUEUE_CAPACITY:100}
app.video.storage-path=${VIDEO_STORAGE_PATH:./video-media/}
app.video.public-base-url=${VIDEO_PUBLIC_BASE_URL:}
app.video.max-image-bytes=${VIDEO_MAX_IMAGE_BYTES:20971520}
app.video.max-video-bytes=${VIDEO_MAX_VIDEO_BYTES:524288000}
app.video.max-audio-bytes=${VIDEO_MAX_AUDIO_BYTES:104857600}
