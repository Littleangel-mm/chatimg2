spring.application.name=chatimg2-test

spring.datasource.url=jdbc:h2:mem:chatimg2_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

spring.datasource.hikari.connection-test-query=SELECT 1

app.image.backup-path=${java.io.tmpdir}/chatimg2-test-img/
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
app.api.key=test-api-key
app.api.url=https://example.invalid
app.api.model.text2img=gpt-image-2
app.api.model.img2img=gpt-image-1

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
app.mail.from=test@example.com

app.inspiration.download-images=false
app.inspiration.schedule.enabled=false
app.generation.recovery.enabled=false
app.seedance.api.url=https://example.invalid/openai/v1
app.seedance.api.key=test-seedance-key
app.seedance.api.model=mm2-seedance2.0
app.seedance.api.connect-timeout-ms=3000
app.seedance.api.read-timeout-ms=3000
app.seedance.api.model-cache-ms=3000
app.video.debounce-window-ms=3000
app.video.poll-interval-ms=5000
app.video.poll-delayed-interval-ms=30000
app.video.poll-batch-size=50
app.video.task-lock-ttl-ms=180000
app.video.recovery-enabled=false
app.video.executor.core-size=1
app.video.executor.max-size=2
app.video.executor.queue-capacity=10
app.video.storage-path=${java.io.tmpdir}/chatimg2-test-video/
app.video.max-image-bytes=20971520
app.video.max-video-bytes=524288000
app.video.max-audio-bytes=104857600
