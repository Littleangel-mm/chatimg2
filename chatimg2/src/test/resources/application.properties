spring.application.name=chatimg2-test

spring.datasource.url=jdbc:h2:mem:chatimg2_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.datasource.hikari.connection-test-query=SELECT 1

app.image.backup-path=${java.io.tmpdir}/chatimg2-test-img/
app.api.key=test-api-key
app.api.url=https://example.invalid
app.api.model.text2img=gpt-image-2
app.api.model.img2img=gpt-image-1

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
app.mail.from=test@example.com

app.inspiration.download-images=false
app.inspiration.proxy.enabled=false
app.inspiration.schedule.enabled=false
app.generation.recovery.enabled=false
