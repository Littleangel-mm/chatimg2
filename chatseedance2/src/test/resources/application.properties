spring.application.name=chatseedance2-test

spring.datasource.url=jdbc:h2:mem:chatseedance2_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.seedance.api.key=test-key
app.video.recovery-enabled=false
app.video.debounce-window-ms=3000
app.video.poll-interval-ms=5000
app.video.poll-delayed-interval-ms=30000
app.video.poll-batch-size=50
app.video.task-lock-ttl-ms=180000
app.video.executor.core-size=1
app.video.executor.max-size=2
app.video.executor.queue-capacity=10
app.video.storage-path=${java.io.tmpdir}/chatseedance2-test-media/
app.video.max-image-bytes=20971520
app.video.max-video-bytes=524288000
app.video.max-audio-bytes=104857600
